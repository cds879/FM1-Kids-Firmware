name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Firmware + preview (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: ~/.fm1-toolchains
          key: fm1-toolchains-${{ hashFiles('tools/unix/setup-toolchains.sh') }}

      - name: Install toolchains
        run: sh tools/unix/setup-toolchains.sh ~/.fm1-toolchains

      - name: Toolchain layout (for diagnosis)
        run: |
          cat ~/.fm1-toolchains/jieli/ARCHIVE_SHA256 || true
          ls -la ~/.fm1-toolchains/jieli/pi32v2/bin ~/.fm1-toolchains/jieli/common/bin || true
          find ~/.fm1-toolchains/jieli -name 'LLVMgold*' || true

      - name: Browser preview
        run: sh tools/unix/run.sh preview

      - name: Firmware (kid UI) and its workbench page
        env:
          # GPL: the page links the exact source it was built from
          FM1_SOURCE_URL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
        run: |
          sh tools/unix/run.sh package
          mkdir -p build/out
          cp build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc build/out/FM1-Kids.fwsc
          cp build/official-web/FM1-Official-Open-Source.html build/out/FM1-Kids-Workbench.html
          for f in firmware-report package-report toolchain; do cp build/dx7/$f.json build/out/kids-$f.json; done
          cp build/dx7/sdk.map build/out/kids-sdk.map

      - name: Flash space
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          used = json.load(open("build/out/kids-firmware-report.json"))["app_image_bytes"]
          limit = 453921   # sdk/Package.cs: the largest app image the FM-1 layout accepts
          print(f"### Flash space (kid UI)\n\nApp image {used:,} of {limit:,} bytes: **{limit - used:,} bytes free**.")
          PY

      - name: Firmware (original FM1 Open UI, for comparison and a first hardware test)
        env:
          FM1_SOURCE_URL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
        run: |
          sed -i 's/^#define FM1_KID_UI 1$/#define FM1_KID_UI 0/' app/kid/kid_config.h
          grep -q '^#define FM1_KID_UI 0$' app/kid/kid_config.h
          sh tools/unix/run.sh package
          cp build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc build/out/FM1-Open-original.fwsc
          cp build/official-web/FM1-Official-Open-Source.html build/out/FM1-Open-original-Workbench.html
          git checkout app/kid/kid_config.h

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm1-build-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/preview/index.html
            build/out/

  emulator:
    name: Emulator test
    needs: firmware
    runs-on: ubuntu-latest
    env:
      # github.com/joakimeriksson/fm1-emu (MIT), pinned to a tested commit
      FM1_EMU_REPO: https://github.com/joakimeriksson/fm1-emu
      FM1_EMU_COMMIT: 3e3fb27df91239fe0e7c5bbf82b14c20ad7dd62a
    steps:
      - uses: actions/checkout@v4

      - name: Cache emulator
        id: emu-cache
        uses: actions/cache@v4
        with:
          path: ~/fm1-emu-bin
          key: fm1-emu-${{ env.FM1_EMU_COMMIT }}

      - name: Build emulator
        if: steps.emu-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
          git init -q ~/fm1-emu && cd ~/fm1-emu
          git fetch -q --depth 1 "$FM1_EMU_REPO" "$FM1_EMU_COMMIT" && git checkout -q FETCH_HEAD
          cargo build --release -p fm1-live
          mkdir -p ~/fm1-emu-bin && cp target/release/fm1-live ~/fm1-emu-bin/

      - name: Runtime libraries
        run: sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2

      - uses: actions/download-artifact@v4
        with:
          name: fm1-build-${{ github.sha }}
          path: artifact

      - name: Official FM1 Open build for comparison
        id: official
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          info=$(python3 tools/emu/fetch_official.py official.fwsc)
          echo "M-VAVE official: $info"
          echo "label=M-VAVE's official FM1 Open $info" >> "$GITHUB_OUTPUT"

      - name: Emulator test (kid UI)
        run: |
          python3 tools/emu/fm1_emu_test.py --emu ~/fm1-emu-bin/fm1-live \
            --fwsc artifact/out/FM1-Kids.fwsc --out emu-results/kids --suite kids

      - name: Emulator test (original UI, compared with M-VAVE's build)
        if: always()
        run: |
          ref=""
          [ -f official.fwsc ] && ref="--reference official.fwsc"
          python3 tools/emu/fm1_emu_test.py --emu ~/fm1-emu-bin/fm1-live \
            --fwsc artifact/out/FM1-Open-original.fwsc --out emu-results/original \
            $ref --reference-label "${{ steps.official.outputs.label }}"

      - name: Summary
        if: always()
        run: |
          for part in kids original; do
            [ -f emu-results/$part/summary.md ] && sed "1s/## FM-1 emulator test/## FM-1 emulator test ($part UI)/" \
              emu-results/$part/summary.md >> "$GITHUB_STEP_SUMMARY"
          done
          true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm1-emulator-${{ github.sha }}
          path: |
            emu-results/*/summary.md
            emu-results/*/results.json
            emu-results/*/*/*.png
            emu-results/*/*/*.wav

  docker:
    name: Mac path (Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --platform linux/amd64 -f tools/unix/Dockerfile -t fm1-build .
      - name: Preview and firmware in the container
        run: |
          for mode in preview firmware; do
            docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:/work" -w /work fm1-build sh tools/unix/run.sh "$mode"
          done
          ls -la build/preview build/dx7/generated
